datasets:
  mc:
    - dy_inclusive
    - dy_ht
object_selection:
  zmass:
    field: select_gen_zmass
event_selection:
  hlt_paths:
    muon:
      - SingleMu
  selections:
    dummy_sel: ak.ones_like(events.PV.npvsGood, dtype=bool)
  categories:
    base:
      - dummy_sel
corrections:
  objects:
    - jets
    - muons
    - electrons
    - taus
    - met
  apply_obj_syst: false
  event_weights:
    genWeight: true
    pileupWeight: true
histogram_config:
  flow: true
  add_weight: true
  add_syst_axis: true
  axes:
    gen_ht:
      type: Variable
      edges:
       - 70
       - 100
       - 400
       - 800
       - 1500
       - 2500
       - 3500
      label: gen $\text{H}_{\text{T}}$ [GeV]
      expression: np.zeros_like(events.PV.npvsGood) if not hasattr(events, "LHE") else events.LHE.HT
    dimuon_gen_mass:
      type: Variable
      edges:
       - 5
       - 10
       - 50
       - 120
       - 200
      label: gen $m(\mu\mu)$ [GeV]
      expression: objects['zmass']
  layout:
    gen_info:
      - gen_ht
      - dimuon_gen_mass